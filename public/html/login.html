<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar - AsistiApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo">✓</div>
            <h3>AsistiApp</h3>
            <p>Toma asistencia en segundos</p>
        </div>

        <!-- El formulario manda los datos a procesar_login.php -->
        <form class="auth-form" action="procesar_login.php" method="post">
            <h3>Hola de nuevo</h3>

            <div class="field">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="profe@colegio.edu" required>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button class="btn btn-primary btn-block" style="margin-top:10px">Ingresar</button>
            <p class="auth-link">¿No tenés cuenta? <a href="registro.html">Crear cuenta</a></p>
        </form>
    </div>
</body>
</html>
